<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPツールズ | いけんボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Zen Kaku Gothic New', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace']
        },
        colors: {
          ink: '#121214',
          panel: '#1a1a1d',
          panel2: '#202024',
          line: '#323236',
          linestrong: '#46464c',
          paper: '#f5f4f0',
          muted: '#98979c',
          amber: '#ffb020',
          amberdark: '#d99414',
          amberink: '#1a1200'
        }
      }
    }
  }
</script>
<style>
  body{ background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1.4px); background-size: 24px 24px; }
  #board{
    background-color:#0e0e10;
    background-image:radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1.4px);
    background-size:20px 20px;
  }
  input[type=text]{ background-color:#111113; color:#f5f4f0; }
  input[type=text]::placeholder{ color:#65656b; }
  .note{ box-shadow:0 8px 20px rgba(0,0,0,.45); }
</style>
</head>
<body class="font-sans bg-ink text-paper antialiased">

<header class="border-b border-line relative">
  <div class="absolute top-0 left-0 right-0 h-[3px] bg-amber"></div>
  <div class="max-w-5xl mx-auto px-6 py-6 flex items-center justify-between flex-wrap gap-3">
    <a href="index.html" class="flex items-baseline gap-3 hover:opacity-80">
      <span class="w-2.5 h-2.5 bg-amber inline-block"></span>
      <span class="text-lg font-black tracking-tight">RPツールズ</span>
    </a>
    <nav class="flex gap-6 text-sm">
      <a href="席替えツール.html" class="text-muted hover:text-paper pb-1">席替えツール</a>
      <span class="font-bold text-amber border-b-2 border-amber pb-1">いけんボード</span>
      <a href="グループ活動ボード.html" class="text-muted hover:text-paper pb-1">グループ活動ボード</a>
    </nav>
  </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-10">
  <h1 class="text-xl font-black mb-1">💬 いけんボード</h1>
  <p class="text-sm text-muted mb-1 leading-relaxed">話し合いで出た意見を付箋にして貼っていくボードです。賛成・反対・疑問・アイデアで色分けでき、付箋はドラッグして自由に動かせます。</p>
  <p class="text-xs text-muted/70 font-mono mb-8">※ この画面のメモリー上だけで動くツールです。ページを閉じたり再読み込みすると内容は消えます。</p>

  <section class="bg-panel border border-line rounded-md p-5 mb-5">
    <h2 class="text-sm font-bold mb-3 flex items-center gap-2"><span class="font-mono text-amber text-xs">01</span>意見を追加する</h2>
    <div class="flex items-end gap-4 flex-wrap">
      <div>
        <label for="nameInput" class="block text-xs text-muted mb-1.5">名前(任意)</label>
        <input type="text" id="nameInput" placeholder="例) 山田" class="w-32 border border-line rounded-md px-2.5 py-1.5 text-sm focus:outline-none focus:border-amber">
      </div>
      <div class="flex-1 min-w-[200px]">
        <label for="textInput" class="block text-xs text-muted mb-1.5">意見・コメント</label>
        <input type="text" id="textInput" placeholder="意見を入力してEnter、または追加ボタン" class="w-full border border-line rounded-md px-2.5 py-1.5 text-sm focus:outline-none focus:border-amber">
      </div>
      <button type="button" id="addBtn" class="px-4 py-2 text-sm font-bold text-amberink bg-amber rounded-md hover:brightness-110">＋ 追加する</button>
    </div>
    <div class="mt-4">
      <label class="block text-xs text-muted mb-1.5">カテゴリ</label>
      <div class="flex gap-2 flex-wrap" id="categoryChips"></div>
    </div>
    <div id="statusMsg" class="hidden"></div>
  </section>

  <div class="flex items-center gap-3 flex-wrap mb-3">
    <div class="flex gap-2 flex-wrap text-xs" id="countBadges"></div>
    <div class="flex-1"></div>
    <button type="button" id="tidyBtn" class="px-3 py-1.5 text-xs border border-line rounded-md hover:border-amber hover:text-amber">🧹 カテゴリごとに整頓</button>
    <button type="button" id="fullscreenBtn" class="px-3 py-1.5 text-xs border border-line rounded-md hover:border-amber hover:text-amber">⛶ 全画面表示</button>
    <button type="button" id="clearBtn" class="px-3 py-1.5 text-xs border border-line rounded-md hover:border-rose-500 hover:text-rose-400">🗑 全消去</button>
  </div>

  <div class="bg-panel border border-line rounded-md p-3" id="boardFrame">
    <div class="relative min-h-[480px] rounded-md overflow-hidden" id="board">
      <div id="boardEmpty" class="absolute inset-0 flex items-center justify-center text-center text-sm text-muted px-5 pointer-events-none font-mono">
        まだ意見がありません。<br>上のフォームから最初の意見を追加してみましょう。
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-line py-8 mt-10">
  <p class="text-center text-xs text-muted font-mono tracking-wide">RPツールズ</p>
</footer>

<script src="いけんボード.js"></script>
</body>
</html>
