<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPツールズ | 活動報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Zen Kaku Gothic New', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace']
        },
        colors: {
          ink: '#121214',
          panel: '#1a1a1d',
          panel2: '#202024',
          line: '#323236',
          linestrong: '#46464c',
          paper: '#f5f4f0',
          muted: '#98979c',
          amber: '#ffb020',
          amberdark: '#d99414',
          amberink: '#1a1200'
        }
      }
    }
  }
</script>
<style>
  body{ background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1.4px); background-size: 24px 24px; }
  input[type=text], textarea{ background-color:#111113; color:#f5f4f0; }
  input[type=text]::placeholder, textarea::placeholder{ color:#65656b; }
  textarea{ resize:vertical; }

  .status-chip{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid #323236;background:#111113;color:#98979c;
    padding:6px 11px;border-radius:999px;font-size:12px;cursor:pointer;
    font-family:inherit;transition:all .15s ease;
  }
  .status-chip:hover{border-color:#46464c;color:#f5f4f0;}
  .status-chip.on-todo.selected{border-color:#65656b;background:rgba(101,101,107,0.18);color:#e5e4e2;font-weight:700;}
  .status-chip.on-doing.selected{border-color:#ffb020;background:rgba(255,176,32,0.12);color:#ffd27a;font-weight:700;}
  .status-chip.on-done.selected{border-color:#34d399;background:rgba(52,211,153,0.12);color:#6ee7b7;font-weight:700;}

  .group-card{border-top-width:3px;}
  .group-card.state-todo{border-top-color:#65656b;}
  .group-card.state-doing{border-top-color:#ffb020;}
  .group-card.state-done{border-top-color:#34d399;}

  .field-label{font-size:11px;color:#98979c;font-weight:700;letter-spacing:.04em;margin-bottom:5px;display:block;}
</style>
</head>
<body class="font-sans bg-ink text-paper antialiased">

<header class="border-b border-line relative">
  <div class="absolute top-0 left-0 right-0 h-[3px] bg-amber"></div>
  <div class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between flex-wrap gap-3">
    <a href="index.html" class="flex items-baseline gap-3 hover:opacity-80">
      <span class="w-2.5 h-2.5 bg-amber inline-block"></span>
      <span class="text-lg font-black tracking-tight">RPツールズ</span>
    </a>
    <nav class="flex gap-6 text-sm">
      <a href="席替えツール.html" class="text-muted hover:text-paper pb-1">席替えツール</a>
      <a href="いけんボード.html" class="text-muted hover:text-paper pb-1">いけんボード</a>
      <span class="font-bold text-amber border-b-2 border-amber pb-1">活動報告</span>
    </nav>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-10">
  <h1 class="text-xl font-black mb-1">🧩 活動報告</h1>
  <p class="text-sm text-muted mb-1 leading-relaxed">各班の活動内容を付箋形式で記録する活動報告ボードです。同じ班から何枚でも報告を投稿できます。</p>
  <p class="text-xs text-muted/70 font-mono mb-8">※ この画面のメモリー上だけで動くツールです。ページを閉じたり再読み込みすると内容は消えます。</p>

  <section class="bg-panel border border-line rounded-md p-5 mb-6">
    <h2 class="text-sm font-bold mb-3 flex items-center gap-2"><span class="font-mono text-amber text-xs">01</span>活動報告を追加する</h2>
    <div class="flex items-end gap-3 flex-wrap">
      <div class="flex-1 min-w-[200px]">
        <label for="groupNameInput" class="field-label">班の名前</label>
        <input type="text" id="groupNameInput" placeholder="例) 1班、環境チーム、など" class="w-full border border-line rounded-md px-3 py-2 text-sm focus:outline-none focus:border-amber">
      </div>
      <button type="button" id="addGroupBtn" class="px-4 py-2 text-sm font-bold text-amberink bg-amber rounded-md hover:brightness-110">＋ 報告を追加</button>
    </div>
    <div id="statusMsg" class="hidden text-sm px-3 py-2 rounded-md mt-3"></div>
  </section>

  <div class="flex items-center gap-3 flex-wrap mb-4">
    <div class="flex gap-2 flex-wrap text-xs" id="countBadges"></div>
  </div>

  <div id="boardEmpty" class="border border-dashed border-line rounded-md p-10 text-center text-sm text-muted font-mono">
    まだ活動報告がありません。上のフォームから最初の報告を追加しましょう。
  </div>

  <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
</main>

<footer class="border-t border-line py-8 mt-10">
  <p class="text-center text-xs text-muted font-mono tracking-wide">RPツールズ</p>
</footer>

<script>
(function(){
  const groupNameInput = document.getElementById('groupNameInput');
  const addGroupBtn = document.getElementById('addGroupBtn');
  const statusMsg = document.getElementById('statusMsg');
  const cardsGrid = document.getElementById('cardsGrid');
  const boardEmpty = document.getElementById('boardEmpty');
  const countBadges = document.getElementById('countBadges');

  let reports = [];
  let reportSeq = 0;

  function showStatus(msg, type){
    statusMsg.textContent = msg;
    statusMsg.className =
      'text-sm px-3 py-2 rounded-md mt-3 ' +
      (type === 'error'
        ? 'bg-rose-950 text-rose-300 border border-rose-800'
        : 'bg-emerald-950 text-emerald-300 border border-emerald-800');
    window.clearTimeout(showStatus._t);
    showStatus._t = window.setTimeout(() => {
      statusMsg.className = 'hidden';
    }, 2600);
  }

  function nowLabel(){
    return new Date().toLocaleTimeString('ja-JP', {
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function updateEmptyState(){
    boardEmpty.style.display = reports.length ? 'none' : 'block';
  }

  function updateCountBadges(){
    countBadges.innerHTML = '';

    const groups = [...new Set(reports.map(r => r.groupName))];

    const total = document.createElement('span');
    total.className =
      'inline-flex items-center border border-linestrong rounded-md px-2.5 py-1 text-paper font-bold font-mono';
    total.textContent = `報告 ${reports.length}件`;
    countBadges.appendChild(total);

    groups.forEach(name => {
      const n = reports.filter(r => r.groupName === name).length;
      const span = document.createElement('span');
      span.className =
        'inline-flex items-center gap-1.5 border border-line rounded-md px-2.5 py-1 text-muted font-mono';
      span.textContent = `${name} ${n}件`;
      countBadges.appendChild(span);
    });
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function removeReport(report){
    reports = reports.filter(r => r.id !== report.id);
    report.cardEl.remove();
    updateEmptyState();
    updateCountBadges();
  }

  function buildCard(report){
    const card = document.createElement('div');
    card.className =
      'group-card bg-panel border border-line rounded-md p-4';

    card.innerHTML = `
      <div class="flex items-start justify-between gap-2 mb-3">
        <div>
          <div class="text-xs text-muted font-mono mb-1">活動報告</div>
          <div class="font-bold text-base">${escapeHtml(report.groupName)}</div>
        </div>
        <button type="button"
          class="delete-btn text-muted hover:text-rose-400 text-sm shrink-0"
          aria-label="この報告を削除"
          title="削除">✕</button>
      </div>

      <div class="mb-3">
        <label class="field-label">活動内容</label>
        <textarea
          class="report-field w-full border border-line rounded-md p-2 text-sm min-h-[110px] focus:outline-none focus:border-amber"
          placeholder="例) ○○について資料を集め、発表内容を整理しました。">${escapeHtml(report.text)}</textarea>
      </div>

      <div class="updated-label text-[11px] text-muted/70 font-mono">
        投稿 ${escapeHtml(report.createdAt)}
      </div>
    `;

    card.querySelector('.report-field').addEventListener('input', e => {
      report.text = e.target.value;
    });

    card.querySelector('.delete-btn').addEventListener('click', () => {
      const ok = window.confirm(
        `「${report.groupName}」のこの活動報告を削除します。よろしいですか?`
      );
      if(ok) removeReport(report);
    });

    report.cardEl = card;
    return card;
  }

  function addReport(groupName){
    const report = {
      id: 'r' + (++reportSeq),
      groupName,
      text: '',
      createdAt: nowLabel()
    };

    reports.push(report);

    const card = buildCard(report);
    cardsGrid.appendChild(card);

    updateEmptyState();
    updateCountBadges();

    // 新しく追加した報告の入力欄へ自動フォーカス
    card.querySelector('.report-field').focus();
  }

  addGroupBtn.addEventListener('click', () => {
    const name = groupNameInput.value.trim();

    if(!name){
      showStatus('班の名前を入力してください。', 'error');
      groupNameInput.focus();
      return;
    }

    addReport(name);
    groupNameInput.value = '';
    groupNameInput.focus();
  });

  groupNameInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') addGroupBtn.click();
  });

  updateEmptyState();
  updateCountBadges();
})();
</script>
</script>

</body>
</html>
